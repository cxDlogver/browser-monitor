name: browser-monitor

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
    volumes:
      - monitor-timescale-data:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - monitor-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: platform/infra/Dockerfile.backend
    command: ["pnpm", "--filter", "@browser-monitor/database", "migrate"]
    environment: &backend-environment
      NODE_ENV: ${NODE_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      API_PORT: 3000
      DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD:-monitor}@timescaledb:5432/monitor
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: ${COOKIE_SECRET:-local-cookie-secret-change-before-production}
      USER_HASH_SECRET: ${USER_HASH_SECRET:-local-user-hash-secret-change-in-production}
      AUDIT_HEADER_ENCRYPTION_KEY: ${AUDIT_HEADER_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Browser Monitor <monitor@example.test>}
      SESSION_TTL_SECONDS: 604800
      ALLOW_ORIGINLESS_INGEST: ${ALLOW_ORIGINLESS_INGEST:-false}
      INGEST_PROJECT_RATE_PER_SECOND: ${INGEST_PROJECT_RATE_PER_SECOND:-100}
      INGEST_PROJECT_BURST: ${INGEST_PROJECT_BURST:-500}
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_BATCH_SIZE: 100
      AUDIT_POLL_INTERVAL_MS: ${AUDIT_POLL_INTERVAL_MS:-2000}
      AUDIT_CHROME_PATH: ${AUDIT_CHROME_PATH:-/usr/bin/chromium}
      AUDIT_ALLOW_PRIVATE_TARGETS: ${AUDIT_ALLOW_PRIVATE_TARGETS:-false}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: platform/infra/Dockerfile.backend
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: platform/infra/Dockerfile.backend
    command: ["pnpm", "--filter", "@browser-monitor/worker", "start"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  audit-worker:
    build:
      context: ../..
      dockerfile: platform/infra/Dockerfile.audit-worker
      args:
        # Always use HTTPS. Override this in platform/.env when the official
        # Debian mirror is slow or unreachable from Docker Desktop.
        DEBIAN_MIRROR_BASE: ${DEBIAN_MIRROR_BASE:-https://deb.debian.org}
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    shm_size: 1gb
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: platform/infra/Dockerfile.web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  monitor-timescale-data:
  monitor-redis-data:
